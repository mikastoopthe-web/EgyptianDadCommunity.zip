name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Unzip project
        run: unzip -q -o ./*.zip
      - name: Build debug APK
        working-directory: EgyptianDadCommunity
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Rename APK
        run: cp EgyptianDadCommunity/app/build/outputs/apk/debug/app-debug.apk EgyptianDadCommunity.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1
          name: Egyptian Dad Community
          files: EgyptianDadCommunity.apk
