name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Unzip project
        run: unzip -q -o ./*.zip
      - name: Build debug APK
        working-directory: EgyptianDadCommunity
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: egyptian-dad-community-apk
          path: EgyptianDadCommunity/app/build/outputs/apk/debug/app-debug.apk
